[project]
name = "spotify-tools"
version = "0.1.0"
description = "Spotify playlist management scripts for personal use"
authors = [{ name = "y-marui" }]
requires-python = ">=3.11"
dependencies = [
    "spotipy>=2.23",
    "python-dotenv>=1.0",
]

[project.scripts]
split-playlist = "spotify_tools.split_playlist:main"
find-duplicates = "spotify_tools.find_duplicates:main"
spotify-inventory = "spotify_tools.inventory_cli:main"
reorder-by-key = "spotify_tools.reorder_by_key_cli:main"
spotify-playlist = "spotify_tools.playlist_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_tools"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["spotipy", "spotipy.*"]
ignore_missing_imports = true
